name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/goreleaser.yaml@9e98bee4aee24c7fe3199099bd0329d2deee8985 # v2.0.29
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
